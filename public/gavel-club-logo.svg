<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C90E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Crest Shield -->
  <circle cx="250" cy="250" r="230" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Outer Banner Ring Text Curve -->
  <path id="textPath" d="M 80 250 A 170 170 0 1 1 420 250" fill="none" />
  <text fill="url(#goldGrad)" font-family="'Outfit', sans-serif" font-weight="800" font-size="28" letter-spacing="4">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">PSS MIYAPUR GAVEL CLUB</textPath>
  </text>
  
  <!-- Center Emblem Group -->
  <g transform="translate(0, 20)">
    <!-- Gavel Graphic -->
    <!-- Sound Block -->
    <rect x="180" y="320" width="140" height="24" rx="6" fill="url(#goldGrad)" stroke="#0B192C" stroke-width="2" />
    <rect x="200" y="310" width="100" height="10" rx="3" fill="#F6C90E" />

    <!-- Gavel Handle -->
    <path d="M 235 310 L 170 180 C 165 170 175 160 185 165 L 250 295 Z" fill="url(#goldGrad)" />

    <!-- Gavel Head -->
    <g transform="rotate(-35, 230, 180)">
      <rect x="170" y="150" width="120" height="50" rx="8" fill="url(#goldGrad)" stroke="#0B192C" stroke-width="3" />
      <rect x="160" y="145" width="20" height="60" rx="4" fill="#F6C90E" />
      <rect x="280" y="145" width="20" height="60" rx="4" fill="#F6C90E" />
    </g>

    <!-- Toastmasters Globe Lines Background -->
    <circle cx="250" cy="220" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />
    <ellipse cx="250" cy="220" rx="75" ry="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" />
    <line x1="250" y1="145" x2="250" y2="295" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Stars -->
  <polygon points="120,380 126,396 143,396 129,406 134,422 120,412 106,422 111,406 97,396 114,396" fill="url(#goldGrad)" />
  <polygon points="380,380 386,396 403,396 389,406 394,422 380,412 366,422 371,406 357,396 374,396" fill="url(#goldGrad)" />

  <!-- Bottom Ribbon Subtitle -->
  <path d="M 150 430 Q 250 455 350 430 L 330 400 Q 250 420 170 400 Z" fill="url(#goldGrad)" />
  <text x="250" y="422" fill="#0B192C" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="2">LEADERSHIP &amp; SPEECH</text>
</svg>
